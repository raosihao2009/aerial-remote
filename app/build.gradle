plugins {
    id 'com.android.application'
}
android {
    namespace 'app.orchard.remote'
    compileSdk 34
    defaultConfig {
        applicationId "app.orchard.remote"
        minSdk 24
        targetSdk 34
        versionCode 19
        versionName "1.11.2"
    }
    buildTypes {
        release {
            minifyEnabled false
            // 没有独立发布密钥, 用 debug 签名兜底, 这样 CI 出的包可以直接侧载安装。
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
}
