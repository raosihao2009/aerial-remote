plugins {
    id 'com.android.application'
}
android {
    namespace 'app.orchard.remote'
    compileSdk 34
    defaultConfig {
        applicationId "app.orchard.remote"
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName "1.1"
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
}
