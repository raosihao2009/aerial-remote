<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>
:root{--bg:#f2f2f7;--card:#fff;--label:#000;--secondary:rgba(60,60,67,.6);--tertiary:rgba(60,60,67,.3);
--sep:rgba(60,60,67,.18);--tint:#007aff;--fill:rgba(118,118,128,.12);--danger:#ff3b30;
--scrim:rgba(0,0,0,.32);--sheet:#f2f2f7}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{height:100%;overflow:hidden;font-family:-apple-system,system-ui,sans-serif;background:transparent}
.scrim{position:fixed;inset:0;background:var(--scrim);opacity:0;transition:opacity .2s ease}
.scrim.open{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--sheet);border-radius:14px 14px 0 0;
padding:8px 16px 24px;transform:translateY(100%);transition:transform .2s cubic-bezier(.32,.72,0,1);
max-height:88%;overflow-y:auto}
.sheet.open{transform:none;transition:transform .38s cubic-bezier(.32,.72,0,1)}
.grab{width:36px;height:5px;border-radius:3px;background:var(--tertiary);margin:0 auto 14px}
h3{text-align:center;font-size:17px;font-weight:600;margin:0 0 16px;color:var(--label)}
.list{background:var(--card);border-radius:12px;overflow:hidden}
.list+.list{margin-top:10px}
.item{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:11px 16px;
border:0;background:none;text-align:left;font-size:16px;color:var(--label);font-family:inherit;
transition:background-color .2s ease;cursor:pointer}
.item+.item::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.item:active{background:var(--fill);transition-duration:0s}
.item.center{justify-content:center;font-weight:500}
.item.tint{color:var(--tint)}
.item.danger{color:var(--danger)}
.item.strong{font-weight:600}
.item:disabled{color:var(--tertiary)}
.item:disabled:active{background:none}
input{width:100%;border:0;background:none;outline:none;font-size:16px;color:var(--label);
padding:13px 16px;font-family:inherit}
input::placeholder{color:var(--tertiary)}
.foot{color:var(--secondary);font-size:13px;margin:10px 4px 0;line-height:1.4}
.err{color:var(--danger);font-size:13px;margin:10px 4px 0;line-height:1.4;min-height:18px}
.seg{display:flex;background:var(--fill);border-radius:10px;padding:2px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;min-height:36px;border-radius:8px;font-size:15px;color:var(--secondary);
font-family:inherit;cursor:pointer}
.seg button.on{background:var(--card);color:var(--label);font-weight:600}
.hidden{display:none}
</style></head><body>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet">
<div class="grab" id="grab"></div>
<h3 id="title">添加TV设备</h3>
<div class="seg" id="seg">
  <button id="tabLan" type="button">同一WiFi</button>
  <button id="tabRemote" type="button">远程</button>
</div>
<div class="list" id="rowLan"><input id="url" placeholder="设备地址，如 192.168.1.4:8791" inputmode="url"></div>
<div class="list hidden" id="rowRemote">
  <input id="base" placeholder="中继地址（默认即可）" inputmode="url">
  <input id="code" placeholder="设备码（电视上显示的 10 位）" inputmode="text" autocomplete="off">
  <input id="secret" placeholder="密钥（电视上显示的 20 位）" inputmode="text" autocomplete="off">
</div>
<div class="list"><input id="name" placeholder="设备名称，如 当贝盒子"></div>
<div class="foot" id="foot">填写电视局域网地址和名称，地址会自动使用 HTTPS。</div>
<div class="err" id="err"></div>
<div class="list" id="btnOk"><button class="item center strong tint" id="ok" disabled>确定</button></div>
<div class="list" id="btnDel" style="display:none"><button class="item center danger">从列表删除</button></div>
<script>
var P={};
location.search.replace(/^\?/,'').split('&').forEach(function(kv){
  if(!kv)return;var a=kv.split('=');P[decodeURIComponent(a[0])]=decodeURIComponent(a[1]||'');
});
var mode=P.mode||'add';
var relayEntry=P.url&&P.url.indexOf('relay://')===0;
var remote=relayEntry;
var urlInput=document.getElementById('url');
var baseInput=document.getElementById('base');
var codeInput=document.getElementById('code');
var secretInput=document.getElementById('secret');
var nameInput=document.getElementById('name');
var ok=document.getElementById('ok');
var err=document.getElementById('err');

function normLan(v){
  v=(v||'').trim();
  if(!v)return'';
  if(!/^[a-zA-Z][a-zA-Z0-9+.\-]*:\/\//.test(v))v='https://'+v;
  var m=v.match(/^(?:[a-zA-Z][a-zA-Z0-9+.\-]*):\/\/([^\/?#]+)([\/?#].*)?$/);
  if(!m)return'';
  var host=m[1].replace(/:\d+$/,'').toLowerCase();
  if(!/^[a-z0-9.\-]+$/.test(host))return'';
  var rest=m[2]||'/';
  if(rest.charAt(0)!=='/')rest='/'+rest.split(/[?#]/)[0];
  return 'https://'+host+':8791'+rest;
}
function normBase(v){
  v=(v||'').trim();
  if(!v)return'';
  if(!/^[a-zA-Z][a-zA-Z0-9+.\-]*:\/\//.test(v))v='https://'+v;
  while(v.charAt(v.length-1)==='/')v=v.slice(0,-1);
  return v;
}
function showErr(msg){err.textContent=msg||'';}
function refresh(){
  err.textContent='';
  document.getElementById('tabLan').classList.toggle('on',!remote);
  document.getElementById('tabRemote').classList.toggle('on',remote);
  document.getElementById('rowLan').classList.toggle('hidden',remote);
  document.getElementById('rowRemote').classList.toggle('hidden',!remote);
  if(mode==='edit'){
    document.getElementById('title').textContent=relayEntry?'编辑远程设备':'编辑设备';
    document.getElementById('foot').textContent=relayEntry?'设备码和中继地址不可改，只能改名称和密钥。':'地址改了会自动修正端口和协议。';
  }else{
    document.getElementById('foot').textContent=remote
      ? '填中继地址、电视上显示的设备码和密钥；不在同一 WiFi 也能遥控。'
      : '填写电视局域网地址和名称，地址会自动使用 HTTPS。';
  }
  check();
}
function check(){
  if(mode==='edit'){
    if(relayEntry){
      ok.disabled=!(nameInput.value.trim()&&secretInput.value.trim());
    }else{
      ok.disabled=!nameInput.value.trim();
    }
    return;
  }
  if(remote){
    var b=normBase(baseInput.value);
    var c=codeInput.value.trim();
    var s=secretInput.value.trim();
    ok.disabled=!(b&&c&&s&&nameInput.value.trim());
    document.getElementById('foot').textContent=b?('将连接 '+b):'填中继地址、设备码和密钥';
  }else{
    var u=normLan(urlInput.value);
    ok.disabled=!(u&&nameInput.value.trim());
    document.getElementById('foot').textContent=u?('将访问 '+u):'填写后自动补成 HTTPS 8791 端口';
  }
}
function show(){
  document.getElementById('scrim').classList.add('open');
  document.getElementById('sheet').classList.add('open');
}
function hide(){
  document.getElementById('scrim').classList.remove('open');
  document.getElementById('sheet').classList.remove('open');
  setTimeout(function(){Android.close();},220);
}
if(mode==='edit'){
  document.getElementById('btnDel').style.display='';
  nameInput.value=P.name||'';
  if(relayEntry){
    codeInput.value=P.url.slice('relay://'.length);
    codeInput.disabled=true;
    baseInput.value=P.relay||'';
    baseInput.disabled=true;
    secretInput.value=P.secret||'';
  }else{
    urlInput.value=P.url||'';
  }
  ok.disabled=!(nameInput.value.trim());
}else{
  urlInput.value='';baseInput.value='https://aerial-relay-pwmyuzhaef.cn-hangzhou.fcapp.run';codeInput.value='';secretInput.value='';nameInput.value='';
  ok.disabled=true;
}
document.getElementById('tabLan').addEventListener('click',function(){remote=false;refresh();});
document.getElementById('tabRemote').addEventListener('click',function(){remote=true;refresh();});
urlInput.addEventListener('input',check);
baseInput.addEventListener('input',check);
codeInput.addEventListener('input',check);
secretInput.addEventListener('input',check);
nameInput.addEventListener('input',check);
ok.addEventListener('click',function(){
  if(mode==='edit'){
    if(relayEntry){
      Android.saveEditRemote(P.url,nameInput.value.trim(),secretInput.value.trim());
    }else{
      Android.saveEdit(P.url,normLan(urlInput.value),nameInput.value.trim());
    }
    hide();
  }else if(remote){
    Android.saveRemote(normBase(baseInput.value),codeInput.value.trim(),secretInput.value.trim(),nameInput.value.trim());
  }else{
    Android.save(normLan(urlInput.value),nameInput.value.trim());
    hide();
  }
});
// 配对失败时 Java 回调用这个把原因显示在面板里, 面板不关。
window.RemotePair={fail:function(msg){showErr(msg);}};
document.querySelector('#btnDel button').addEventListener('click',function(){
  Android.remove(P.url);hide();
});
document.getElementById('scrim').addEventListener('click',hide);
var sy=0,dy=0,sheet=document.getElementById('sheet'),grab=document.getElementById('grab');
grab.addEventListener('touchstart',function(e){sy=e.touches[0].clientY;sheet.style.transition='none';},{passive:true});
grab.addEventListener('touchmove',function(e){
  dy=Math.max(0,e.touches[0].clientY-sy);
  sheet.style.transform='translateY('+dy+'px)';
},{passive:true});
grab.addEventListener('touchend',function(){
  sheet.style.transition='';
  if(dy>80){sheet.style.transform='';hide();}
  else{sheet.style.transform='';}
  dy=0;
});
refresh();
setTimeout(show,30);
</script></body></html>
