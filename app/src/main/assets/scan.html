<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:sans-serif}
video{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover}
.scan-box{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:240px;height:240px;border:2px solid #fff;border-radius:20px;box-shadow:0 0 0 9999px rgba(0,0,0,.35)}
.tip{position:fixed;bottom:80px;width:100%;text-align:center;color:#fff;font-size:16px}
.err{position:fixed;top:50%;width:100%;text-align:center;color:#fff;font-size:14px;padding:20px}
</style></head><body>
<video id="v" autoplay playsinline muted></video>
<div class="scan-box"></div>
<div class="tip">将二维码放入框内</div>
<div class="err" id="err" style="display:none"></div>
<script>
var video=document.getElementById('v');
var errEl=document.getElementById('err');
function showErr(m){errEl.style.display='block';errEl.textContent=m;}
navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false})
.then(function(s){
  video.srcObject=s;
  video.play().catch(function(e){showErr('播放失败:'+e);});
  if('BarcodeDetector' in window){
    var bd=new BarcodeDetector({formats:['qr_code']});
    setInterval(function(){
      bd.detect(video).then(function(codes){
        if(codes.length>0){Android.onScan(codes[0].rawValue);}
      }).catch(function(){});
   },400);
  }else{
    showErr('当前WebView不支持扫码, 请用微信扫码后粘贴');
  }
})
.catch(function(e){showErr('无法打开摄像头:'+e);});
</script></body></html>
