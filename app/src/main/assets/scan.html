<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{margin:0;background:#000;font-family:sans-serif}
video{width:100%;height:100%;object-fit:cover;position:fixed;top:0;left:0}
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.box{width:220px;height:220px;border:3px solid #fff;border-radius:16px;box-shadow:0 0 0 9999px rgba(0,0,0,.4)}
.tip{position:fixed;bottom:60px;left:0;right:0;text-align:center;color:#fff;font-size:16px}
</style></head><body>
<video id="v" playsinline></video>
<div class="overlay"><div class="box"></div></div>
<div class="tip">将二维码放入框内</div>
<script>
const video=document.getElementById('v');
navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}).then(s=>{
  video.srcObject=s;video.play();
  const bd=new BarcodeDetector({formats:['qr_code']});
  setInterval(async()=>{
    try{const codes=await bd.detect(video);
      if(codes.length){Android.onScan(codes[0].rawValue);}
    }catch(e){}
  },500);
});
</script></body></html>
