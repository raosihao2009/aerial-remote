<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<style>
:root{--bg:#f2f2f7;--card:#fff;--tint:#007aff;--fill:rgba(118,118,128,.12);--danger:#ff3b30;--sep:rgba(60,60,67,.18)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:-apple-system,sans-serif;background:var(--bg);overflow:hidden}
#tabs{height:48px;display:flex;align-items:center;padding:0 8px;gap:8px;overflow-x:auto;background:var(--bg);border-bottom:.5px solid var(--sep)}
#tabs::-webkit-scrollbar{display:none}
.pill{flex-shrink:0;height:32px;padding:0 16px;border-radius:16px;background:var(--fill);display:flex;align-items:center;font-size:14px;color:#333}
.pill.active{background:var(--tint);color:#fff}
.pill.add{background:#34c759;color:#fff}
#frame{position:absolute;top:48px;left:0;right:0;bottom:0;border:none;background:#fff}
#sheet-mask{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);display:none;z-index:10}
#sheet{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-radius:14px 14px 0 0;padding:8px 16px 24px;transform:translateY(100%);transition:transform .25s;z-index:11;max-height:80vh;overflow-y:auto}
#sheet.open{transform:translateY(0)}
.grab{width:36px;height:5px;border-radius:3px;background:rgba(60,60,67,.18);margin:0 auto 8px}
.sheet-title{text-align:center;font-size:17px;font-weight:600;padding:8px 0 16px}
.card{background:var(--card);border-radius:12px;margin-top:10px;overflow:hidden}
.card:first-child{margin-top:0}
.item{padding:14px 16px;text-align:center;font-size:16px;color:var(--tint);border-bottom:.5px solid var(--sep);width:100%;background:none;border-left:none;border-right:none;border-top:none}
.item:last-child{border-bottom:none}
.item.danger{color:var(--danger)}
.item:disabled{opacity:.3}
input{width:100%;padding:14px 16px;font-size:16px;border:none;background:transparent;outline:none}
.hint{padding:8px 16px 0;font-size:13px;color:#8e8e93}
</style></head><body>
<div id="tabs"></div>
<iframe id="frame"></iframe>
<div id="sheet-mask" onclick="closeSheet()"></div>
<div id="sheet">
<div class="grab"></div>
<div class="sheet-title" id="sheet-title">添加TV设备</div>
<div class="hint" style="padding:0 4px 4px">设备地址</div>
<div class="card"><input id="url" placeholder="192.168.1.4:8791" inputmode="url"></div>
<div class="hint" style="padding:10px 4px 4px">设备名称</div>
<div class="card"><input id="name" placeholder="如：当贝盒子"></div>
<div class="card"><button class="item" id="ok-btn" disabled onclick="confirm()">确定</button></div>
</div>
<script>
var devices=[];
var scannedUrl=null;
function renderTabs(){
  var t=document.getElementById('tabs');t.innerHTML='';
  devices.forEach(function(d){
    var b=document.createElement('div');
    b.className='pill'+(d.url===location.hash.slice(1)?' active':'');
    b.textContent=d.name;
    b.onclick=function(){load(d.url);};
    b.oncontextmenu=function(){rename(d.url);return false;};
    t.appendChild(b);
  });
  var add=document.createElement('div');
  add.className='pill add';add.textContent='+ 添加';
  add.onclick=function(){openSheet();};
  t.appendChild(add);
}
function load(url){
  location.hash=url;
  document.getElementById('frame').src=url;
}
function openSheet(){checkOk();document.getElementById('sheet-mask').style.display='block';setTimeout(function(){document.getElementById('sheet').classList.add('open');},10);}
function closeSheet(){document.getElementById('sheet').classList.remove('open');setTimeout(function(){document.getElementById('sheet-mask').style.display='none';},250);}
function normalize(input){
  var v=input.trim();
  if(!v)return '';
  if(!/^http/.test(v))v='https://'+v;
  v=v.replace('http://','https://').replace(':8790',':8791');
  if(!v.endsWith('/'))v+='/';
  return v;
}
function confirm(){
  var url=normalize(document.getElementById('url').value);
  var name=document.getElementById('name').value.trim();
  if(!url||!name)return;
  Android.addDevice(url,name);
  document.getElementById('url').value='';
  document.getElementById('name').value='';
  closeSheet();
  checkOk();
}
function checkOk(){
  var ok=normalize(document.getElementById('url').value)!==''&&document.getElementById('name').value.trim()!=='';
  document.getElementById('ok-btn').disabled=!ok;
}
document.getElementById('url').addEventListener('input',checkOk);
document.getElementById('name').addEventListener('input',checkOk);
Android.getDevices();
</script></body></html>
